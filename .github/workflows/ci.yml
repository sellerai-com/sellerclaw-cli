name: CI — lint, type-check & tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + type-check + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # --locked: install exactly the committed uv.lock, and fail if it no longer matches
      # pyproject.toml instead of silently re-resolving. Without it, a dependency edit pushed without
      # its lock update passes here, and a third-party release cut minutes ago can redden a run that
      # has nothing to do with the change under test (mcp 2.0.0 did exactly that on 2026-07-28).
      - name: Install dependencies
        run: uv sync --group dev --locked --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest -m unit

  plugin:
    name: Committed plugin matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The Claude Code plugin under plugins/ is generated from plugin/ and committed (the marketplace
      # serves it straight from main). Fail if it drifts from the source tree. Same command the local
      # release gate runs (`make plugin-check`), so the two can never disagree.
      - name: Committed plugin is up to date
        run: python3 scripts/build_plugin.py --check
